seed: 42
tf32: false
log_dir: ./logs/lieformer_shr_mh_oc22/
print_freq: 100

task:
  dataset: oc22
  root_dir: ./download/oc22
  train_split: train
  val_split: val_id
  with_force: true
  train_on_free_atoms: true
  eval_on_free_atoms: true
  standarize: true
  primary_metric: f_mae
  dataloader:
    batch_size: 16
    eval_batch_size: 8
    num_workers: 4
    pin_memory: true

model:
  name: lieformer_shr_mh
  dn: 256
  de: 256
  n_rbf: 128
  n_blocks: 12
  lmax: 3
  radius: 12.0
  max_num_neighbors: 20
  pbc_neighbor_backend: warp
  force_head: direct
  compile_mode: none
  shr_aggregation_backend: sparse
  shr_B: 2
  shr_K: null
  shr:
    geometry_orders: [0, 1, 2]
    coordinate_scale: 12.0
  ffn_type: gated
  high_order_embedding: false
  final_norm: false
  zero_init_ffn: true
  zero_init_output_heads: true
  attention_type: dot_alpha
  attention_heads: 8
  attention_lmax: 2
  attention_projection: 64
  attention_scalar_head: 32

optim:
  loss: comboloss
  loss_params:
    energy: [mae, 0.25]
    force: [l2mae, 1.0]
  optimizer: adamw
  optimizer_params:
    lr: 0.0002
    weight_decay: 1.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-8
  scheduler: cosine
  scheduler_params:
    T_max: 41500
    eta_min: 2.0e-6
    step_on: optimizer_step
  warmup_params:
    warmup_steps: 500
    warmup_factor: 0.2
  ema_params:
    ema: false

runner:
  run_mode: step
  max_epochs: 10000
  max_steps: 42000
  eval_interval: 6000
  save_interval: 6000
  keep_latest_ckp: false
  clip_grad: 20.0
  early_stop:
    target: val_metric
    patience: 1000000
    mode: min
    min_delta: 0.0
